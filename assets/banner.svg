<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Iker González Rodríguez-Priego · Finance &amp; Data Analyst · AI Automation">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .ink { fill: #E8EAED; } .ink2 { fill: #C9CDD3; } .dim { fill: #A3A9B1; } .amber { fill: #E0A43A; } .green { fill: #4CB782; }
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; }
    @keyframes fade { to { opacity: 1; } }
    #typing { animation: type 2.4s steps(40, end) 1.2s forwards; }
    @keyframes type { from { width: 0; } to { width: 380px; } }
    .caret { animation: caret 2.4s steps(40, end) 1.2s forwards; }
    @keyframes caret { from { transform: translateX(0); } to { transform: translateX(380px); } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .line { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 3s ease-out .8s forwards; }
    .area { opacity: 0; animation: fade 1.2s ease-out 3.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .pulse { transform-origin: 1124px 96px; animation: pulse 2s ease-in-out 3.8s infinite; opacity: 0; }
    @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
    .dot { opacity: 0; animation: fade .3s ease-out 3.7s forwards; }
    .tape { animation: scroll 28s linear infinite; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-1050px); } }
  </style>
