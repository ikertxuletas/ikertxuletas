    <clipPath id="clip-tape"><rect x="1" y="272" width="1198" height="47" rx="0"/></clipPath>
    <linearGradient id="g-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CB782" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4CB782" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x=".5" y=".5" width="1199" height="319" rx="14" fill="#15171A" stroke="#2C3037"/>
