<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Stack: finance, data and automation tools">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .head { fill: #E0A43A; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
    .sub { fill: #A3A9B1; font-size: 12px; }
    .tag rect { fill: #1E2126; stroke: #2C3037; }
    .tag text { fill: #E8EAED; font-size: 13px; }
    .col { opacity: 0; animation: up .7s ease-out forwards; }
    .c2 { animation-delay: .25s; } .c3 { animation-delay: .5s; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <rect x=".5" y=".5" width="1199" height="229" rx="14" fill="#15171A" stroke="#2C3037"/>
  <path d="M400 28 V202 M800 28 V202" stroke="#2C3037"/>

  <g class="col mono">
    <text x="36" y="48" class="head">FINANCE</text>
    <text x="36" y="68" class="sub">what I analyse</text>
    <g class="tag"><rect x="36" y="88" width="172" height="30" rx="7"/><text x="50" y="108">Financial modelling</text></g>
    <g class="tag"><rect x="218" y="88" width="122" height="30" rx="7"/><text x="232" y="108">PE fund data</text></g>
    <g class="tag"><rect x="36" y="128" width="146" height="30" rx="7"/><text x="50" y="148">Month-end close</text></g>
    <g class="tag"><rect x="192" y="128" width="148" height="30" rx="7"/><text x="206" y="148">Reconciliations</text></g>
    <g class="tag"><rect x="36" y="168" width="172" height="30" rx="7"/><text x="50" y="188">Forensic accounting</text></g>
    <g class="tag"><rect x="218" y="168" width="122" height="30" rx="7"/><text x="232" y="188">DCF · comps</text></g>
  </g>

  <g class="col c2 mono">
    <text x="436" y="48" class="head">DATA</text>
    <text x="436" y="68" class="sub">how I work it</text>
    <g class="tag"><rect x="436" y="88" width="164" height="30" rx="7"/><text x="450" y="108">Excel · Power Query</text></g>
    <g class="tag"><rect x="610" y="88" width="56" height="30" rx="7"/><text x="624" y="108">SQL</text></g>
    <g class="tag"><rect x="436" y="128" width="90" height="30" rx="7"/><text x="450" y="148">Power BI</text></g>
    <g class="tag"><rect x="536" y="128" width="72" height="30" rx="7"/><text x="550" y="148">pandas</text></g>
    <g class="tag"><rect x="618" y="128" width="72" height="30" rx="7"/><text x="632" y="148">SQLite</text></g>
    <g class="tag"><rect x="436" y="168" width="150" height="30" rx="7"/><text x="450" y="188">HTML dashboards</text></g>
  </g>

  <g class="col c3 mono">
    <text x="836" y="48" class="head">AUTOMATION</text>
    <text x="836" y="68" class="sub">what does it for me</text>
    <g class="tag"><rect x="836" y="88" width="112" height="30" rx="7"/><text x="850" y="108">Claude Code</text></g>
    <g class="tag"><rect x="958" y="88" width="72" height="30" rx="7"/><text x="972" y="108">Python</text></g>
    <g class="tag"><rect x="1040" y="88" width="56" height="30" rx="7"/><text x="1054" y="108">n8n</text></g>
    <g class="tag"><rect x="836" y="128" width="104" height="30" rx="7"/><text x="850" y="148">Playwright</text></g>
    <g class="tag"><rect x="950" y="128" width="96" height="30" rx="7"/><text x="964" y="148">LLM APIs</text></g>
    <g class="tag"><rect x="836" y="168" width="104" height="30" rx="7"/><text x="850" y="188">PowerShell</text></g>
    <g class="tag"><rect x="950" y="168" width="140" height="30" rx="7"/><text x="964" y="188">Scheduled jobs</text></g>
  </g>
</svg>
